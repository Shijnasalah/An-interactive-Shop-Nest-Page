
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNest - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <header>
        <h1>ShopNest</h1>
        <section class="search-section">

        <input
            type="text"
            id="search-input"
            placeholder="Search products..."
        >

    </section>

        <div class="cart">
            🛒 Cart <span id="cart-count">0</span>
        </div>
    </header>

   

    
    <section class="category-section">

        <button class="filter-btn active" data-category="All">
            All
        </button>

        <button class="filter-btn" data-category="Electronics">
            Electronics
        </button>

        <button class="filter-btn" data-category="Clothing">
            Clothing
        </button>

        <button class="filter-btn" data-category="Footwear">
            Footwear
        </button>

        <button class="filter-btn" data-category="Books">
            Books
        </button>

    </section>

  
    <main>

        <div id="products-container" class="products-container">

        </div>

        <p id="no-products" class="no-products">
            No products found.
        </p>

    </main>

   
    <section class="cart-section">

        <h2>Your Shopping Cart</h2>

        <div id="cart-items">

        </div>

        <h3>Total: ₹<span id="cart-total">0</span></h3>

    </section>

    <script src="script.js"></script>

</body>

</html>
